<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minhas Leituras</title>
  <meta name="description" content="Meu diário de leituras: estante, avaliações por estrelas e releituras.">
  <meta name="theme-color" content="#f5efe6">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..600&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" data-action="nav" data-view="inicio">
      <img src="favicon.svg" alt="" width="38" height="38">
      <span><strong>Minhas Leituras</strong><small>diário de leitura</small></span>
    </a>
    <nav class="tabs" aria-label="Seções">
      <button data-action="nav" data-view="inicio">Início</button>
      <button data-action="nav" data-view="estante">Estante</button>
      <button data-action="nav" data-view="diario">Diário</button>
    </nav>
    <div class="top-actions">
      <button class="btn primary" data-action="novo-livro"><span aria-hidden="true">＋</span> Livro</button>
      <button class="icon-btn" data-action="tema" aria-label="Alternar tema claro/escuro" title="Tema">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <details class="menu">
        <summary class="icon-btn" aria-label="Mais opções" title="Mais opções">⋯</summary>
        <div class="menu-pop">
          <button data-action="exportar">Exportar backup (.json)</button>
          <button data-action="importar">Importar backup</button>
          <button data-action="exemplos">Carregar livros de exemplo</button>
          <hr>
          <button data-action="limpar" class="danger">Apagar tudo</button>
        </div>
      </details>
    </div>
  </header>

  <main id="app"></main>

  <dialog id="modal-detalhe" class="modal wide"></dialog>
  <dialog id="modal-livro" class="modal"></dialog>
  <dialog id="modal-leitura" class="modal"></dialog>

  <input type="file" id="importar-arquivo" accept="application/json,.json" hidden>
  <div id="toasts" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
